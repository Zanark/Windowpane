name: Manual preview release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional new tag; leave blank for preview-<run-id>"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 preview
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Choose a new release tag
        id: identity
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $tag = ([string]$env:REQUESTED_TAG).Trim()
          if (-not $tag) { $tag = "preview-$env:GITHUB_RUN_ID" }
          if ($tag -notmatch '\A[A-Za-z0-9][A-Za-z0-9._-]{0,99}\z') {
              throw 'Tag must contain 1-100 letters, digits, dots, underscores or hyphens, starting with a letter or digit.'
          }
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Tag is not a valid Git reference.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Release
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Run headless pixel tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ tools were not found.' }
          $ctest = Join-Path $visualStudio 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\ctest.exe'
          & $ctest --test-dir build -C Release --output-on-failure -R '^pixels$'
          if ($LASTEXITCODE -ne 0) { throw 'Pixel tests failed.' }

      - name: Package portable download and checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          $assets = Join-Path $PWD 'build\release-assets'
          $portable = Join-Path $PWD 'build\portable'
          New-Item $assets, $portable -ItemType Directory -Force | Out-Null
          Copy-Item 'build\Release\WindowPane.exe' $assets
          Copy-Item 'build\Release\WindowPane.exe' $portable
          Copy-Item 'docs\portable-README.txt' (Join-Path $portable 'README.txt')
          $zipName = "WindowPane-${env:RELEASE_TAG}-win-x64.zip"
          Compress-Archive -LiteralPath (Join-Path $portable 'WindowPane.exe'), (Join-Path $portable 'README.txt') -DestinationPath (Join-Path $assets $zipName)
          $checksums = foreach ($name in @('WindowPane.exe', $zipName)) {
              $hash = (Get-FileHash (Join-Path $assets $name) -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $name"
          }
          Set-Content (Join-Path $assets 'SHA256SUMS.txt') -Value (($checksums -join "`n") + "`n") -Encoding ascii -NoNewline

      - name: Transfer verified build to the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windowpane-${{ steps.identity.outputs.tag }}
          path: build\release-assets\*
          if-no-files-found: error

  publish:
    name: Publish preview to GitHub Releases
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windowpane-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Create immutable tag, verify draft assets, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$TARGET_SHA"
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" \
            --verify-tag --draft --prerelease --title "WindowPane $RELEASE_TAG" \
            --generate-notes \
            --notes "Unsigned Windows x64 portable preview. Default update target: 60 fps. Built from $TARGET_SHA. CI runs headless pixel tests; native capture/UI qualification must be performed separately. Download the ZIP, extract it, and run WindowPane.exe. No installer or auto-start." \
            "release-assets/WindowPane.exe" \
            "release-assets/WindowPane-$RELEASE_TAG-win-x64.zip" \
            "release-assets/SHA256SUMS.txt"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --dir verification --pattern 'WindowPane*' --pattern SHA256SUMS.txt
          (cd verification && sha256sum --check SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
